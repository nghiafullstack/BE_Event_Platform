spring.application.name=identity-service
server.port=8081

spring.config.import=optional:file:.env[.properties]

# DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (secret must be identical across every service; only identity-service issues tokens)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Redis (session/cache)
spring.data.redis.url=${REDIS_URL:redis://localhost:6380}

spring.jackson.date-format=dd/MM/yyyy
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Surface validation/business error messages in the response body — no tester, self-check via Postman
server.error.include-message=always
server.error.include-binding-errors=always

# First-run bootstrap super-admin (platform owner, tenant = null) — change the password after first login
bootstrap.super-admin.username=${SUPERADMIN_USERNAME:superadmin}
bootstrap.super-admin.password=${SUPERADMIN_PASSWORD:ChangeMe123!}
