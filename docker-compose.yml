x-app-env: &app-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  REDIS_URL: redis://redis:6379
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
  JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
  IDENTITY_SERVICE_URL: http://identity-service:8081
  CATALOG_SERVICE_URL: http://catalog-service:8082
  EVENT_SERVICE_URL: http://event-service:8083
  CUSTOMER_SERVICE_URL: http://customer-service:8084
  NOTIFICATION_SERVICE_URL: http://notification-service:8085

services:
  mysql:
    image: mysql:8.0
    container_name: event-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: identity_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"   # host 3307: a native mysqld is already listening on 3306 on this Mac
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: event-platform-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # host 6380: 6379 is already taken by another project's redis on this Mac
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: event-platform-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5673:5672"    # host 5673/15673: 5672/15672 already taken by another project's rabbitmq
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- application services: only api-gateway publishes a host port ---
  # Build the jars first (mvn -q -DskipTests package at the repo root), then
  # `docker compose up -d --build`.

  identity-service:
    build: ./services/identity-service
    container_name: event-platform-identity-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog-service:
    build: ./services/catalog-service
    container_name: event-platform-catalog-service
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      mysql:
        condition: service_healthy

  event-service:
    build: ./services/event-service
    container_name: event-platform-event-service
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  customer-service:
    build: ./services/customer-service
    container_name: event-platform-customer-service
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      mysql:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    container_name: event-platform-notification-service
    restart: unless-stopped
    environment:
      <<: *app-env
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON}
      FCM_TOKEN_RETENTION_DAYS: ${FCM_TOKEN_RETENTION_DAYS:-90}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api-gateway:
    build: ./services/api-gateway
    container_name: event-platform-api-gateway
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "8080:8080"
    depends_on:
      - identity-service
      - catalog-service
      - event-service
      - customer-service
      - notification-service

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
